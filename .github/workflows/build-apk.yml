name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: |
          flutter create --project-name pokeun_gil --org com.pokeungil --platforms=android .
          rm -f test/widget_test.dart
      - name: Apply Health Connect settings
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=USE_HEALTH=true
      - uses: actions/upload-artifact@v4
        with:
          name: pokeun-gil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: adb install -r build/app/outputs/flutter-apk/app-release.apk; adb shell monkey -p com.pokeungil.pokeun_gil -c android.intent.category.LAUNCHER 1; sleep 20; adb shell pidof com.pokeungil.pokeun_gil || echo APP_NOT_RUNNING; adb logcat -d | grep -E "AndroidRuntime|FATAL|flutter" | tail -50
