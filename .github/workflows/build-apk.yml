name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: |
          flutter create --project-name pokeun_gil --org com.pokeungil --platforms=android .
          rm -f test/widget_test.dart
      - name: Apply Health Connect settings
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=USE_HEALTH=true
      - uses: actions/upload-artifact@v4
        with:
          name: pokeun-gil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
