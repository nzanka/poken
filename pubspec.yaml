name: pokeun_gil
description: 걸으면 크는 동물 모험단 (산책 모드 + 러닝 모드)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  health: ^11.0.0            # 애플 건강 / Health Connect 읽기 (버전에 따라 API 확인)
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.5.0   # 크루, 레이드 서버
  home_widget: ^0.6.0        # 홈 화면 위젯 (2차)
  android_intent_plus: ^5.0.0 # Health Connect 설정 화면 열기

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
